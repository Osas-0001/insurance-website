<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../bootstrap-4.6.2-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <title>Sign Up - InsureShield</title>
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1f4d 0%, #0f1535 100%);
      padding: 2rem;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 3rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .auth-header h1 {
      color: #1a1f4d;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .auth-header p {
      color: #666;
      font-size: 1rem;
    }

    .form-group label {
      color: #2c3e50;
      font-weight: 600;
      margin-bottom: 0.8rem;
      font-size: 0.95rem;
    }

    .form-control {
      padding: 0.8rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #2d7dd8;
      box-shadow: 0 0 0 0.2rem rgba(45, 125, 216, 0.15);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn-signup {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #2d7dd8 0%, #1e5db8 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1.5rem;
    }

    .btn-signup:hover {
      background: linear-gradient(135deg, #1e5db8 0%, #154494 100%);
      box-shadow: 0 6px 20px rgba(45, 125, 216, 0.4);
      transform: translateY(-2px);
    }

    .auth-divider {
      text-align: center;
      margin: 2rem 0;
      color: #999;
      font-size: 0.9rem;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      display: inline-block;
      width: 40%;
      height: 1px;
      background-color: #ddd;
      vertical-align: middle;
    }

    .auth-divider::before {
      margin-right: 0.8rem;
    }

    .auth-divider::after {
      margin-left: 0.8rem;
    }

    .social-signup {
      display: flex;
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .social-btn {
      flex: 1;
      padding: 0.8rem;
      border: 2px solid #ddd;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.2rem;
      color: #2c3e50;
    }

    .social-btn:hover {
      border-color: #2d7dd8;
      background: rgba(45, 125, 216, 0.05);
    }

    .auth-footer {
      text-align: center;
      margin-top: 2rem;
      color: #666;
      font-size: 0.95rem;
    }

    .auth-footer a {
      color: #2d7dd8;
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .terms-agreement {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #999;
      line-height: 1.5;
    }

    .terms-agreement a {
      color: #2d7dd8;
      text-decoration: none;
    }

    .terms-agreement a:hover {
      text-decoration: underline;
    }

    .back-link {
      margin-bottom: 2rem;
    }

    .back-link a {
      color: #2d7dd8;
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
    }

    .back-link a:hover {
      gap: 1rem;
      color: #1e5db8;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="back-link">
        <a href="../index.html">
          <i class="fa fa-arrow-left"></i> Back to Home
        </a>
      </div>

      <div class="auth-header">
        <h1><i class="fa fa-shield"></i> InsureShield</h1>
        <p>Create Your Account</p>
      </div>

      <form id="signupForm">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" class="form-control" id="firstName" placeholder="John" required>
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" class="form-control" id="lastName" placeholder="Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" class="form-control" id="phone" placeholder="+1 (555) 000-0000">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Create a strong password" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
        </div>

        <div class="form-group" style="display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 1.5rem; cursor: pointer;">
          <input type="checkbox" id="terms" style="cursor: pointer; margin-top: 0.3rem;" required>
          <label for="terms" style="margin: 0; cursor: pointer; font-weight: 400; font-size: 0.9rem;">
            I agree to the <a href="#" style="color: #2d7dd8;">Terms & Conditions</a> and <a href="#" style="color: #2d7dd8;">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn-signup">Create Account</button>
      </form>

      <div class="auth-divider">OR</div>

      <div class="social-signup">
        <button class="social-btn" title="Sign up with Google">
          <i class="fa fa-google"></i>
        </button>
        <button class="social-btn" title="Sign up with Facebook">
          <i class="fa fa-facebook"></i>
        </button>
        <button class="social-btn" title="Sign up with Twitter">
          <i class="fa fa-twitter"></i>
        </button>
      </div>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <script src="../jquery-3.6.0.min.js"></script>
  <script src="../bootstrap-4.6.2-dist/js/bootstrap.min.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        alert('Passwords do not match!');
        return;
      }

      alert('Account creation functionality would be implemented here!');
      // Add actual signup logic here
    });
  </script>
</body>
</html>
